<style>
:root{--noite:#07033a;--royal:#120573;--eletrico:#1b3fd6;--ciano:#6cd8cf;--ciano-f:#12a594;--tinta:#0c0a2e;--tinta-2:#4a4d63;--tinta-3:#8b8fa3;--linha:#e4e7f0;--nevoa:#f4f6fb;--ft:'Poppins',system-ui,sans-serif;--fc:'Montserrat',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:var(--fc);color:var(--tinta);
  background:radial-gradient(900px 520px at 50% -8%,rgba(108,216,207,.28),transparent 62%),radial-gradient(700px 500px at 100% 100%,rgba(27,63,214,.5),transparent 65%),linear-gradient(170deg,var(--royal),var(--noite) 60%)}
main{width:min(420px,100%);margin:0 auto}
.cartao{width:100%;padding:34px 30px 30px;border-radius:24px;background:#fff;box-shadow:0 40px 100px -24px rgba(0,0,0,.7);display:grid;gap:16px}
.marca{width:84px;color:var(--noite)}
h1{margin:0;font-family:var(--ft);font-weight:600;font-size:24px;letter-spacing:-.02em;color:var(--noite)}
.sub{margin:-6px 0 0;font-size:13.5px;color:var(--tinta-2)}
.campo{display:grid;gap:6px}
.campo>span{font-family:var(--ft);font-size:12px;font-weight:600}
.entrada{position:relative}
input{width:100%;padding:14px 14px;border:0;border-radius:12px;background:var(--nevoa);box-shadow:inset 0 0 0 1.5px var(--linha);font:inherit;font-size:15px;color:var(--tinta)}
input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--ciano-f),0 0 0 4px rgba(108,216,207,.25)}
.entrada input{padding-right:78px}
.ver{position:absolute;right:8px;top:50%;transform:translateY(-50%);padding:6px 10px;border:0;border-radius:8px;background:none;cursor:pointer;font-family:var(--ft);font-size:12px;font-weight:600;color:var(--eletrico)}
.ver:hover{background:rgba(27,63,214,.08)}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 22px;border:0;border-radius:999px;cursor:pointer;font-family:var(--ft);font-size:14.5px;font-weight:600;color:#fff;background:linear-gradient(120deg,var(--royal),var(--eletrico));transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 14px 30px -14px rgba(27,63,214,.8)}
.btn[disabled]{opacity:.6;cursor:progress;transform:none}
.erro{margin:0;padding:10px 13px;border-radius:10px;background:#fdecee;color:#9b1c2c;font-size:13px}
.nota{margin:0;text-align:center;font-size:12px;color:var(--tinta-3)}
</style>

  <h1>Acesso restrito</h1>
  <p class="sub">Área interna da equipe Grou. Entre com o e-mail liberado e a sua senha.</p>
  <label class="campo"><span>E-mail</span><input id="email" name="email" type="email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" required autofocus></label>
  <label class="campo"><span>Senha</span>
    <span class="entrada"><input id="senha" name="senha" type="password" autocomplete="current-password" required><button type="button" class="ver" id="ver" aria-pressed="false">Mostrar</button></span></label>
  <p class="erro" id="erro" role="alert" hidden></p>
  <button class="btn" type="submit" id="entrar">Entrar</button>
  <p class="nota">Sem acesso ou esqueceu a senha? Fale com a Talita.</p>
</form>
</main>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var DESTINO = '/gestao/nr1/';
  /* quem já está logado vai direto para o painel */
  fetch('/api/acesso/', { credentials: 'same-origin', cache: 'no-store' }).then(function (r) { if (r.ok) location.replace(DESTINO); }).catch(function () {});
  $('ver').addEventListener('click', function () {
    var s = $('senha'), mostra = s.type === 'password';
    s.type = mostra ? 'text' : 'password'; this.textContent = mostra ? 'Ocultar' : 'Mostrar'; this.setAttribute('aria-pressed', mostra);
  });
  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var er = $('erro'), bt = $('entrar'); er.hidden = true;
    var email = $('email').value.trim(), senha = $('senha').value;
    if (!email || !senha) { er.textContent = 'Informe o e-mail e a senha.'; er.hidden = false; return; }
    bt.disabled = true; bt.textContent = 'Entrando…';
    fetch('/api/acesso/', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: email, senha: senha }) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { http: r.status, j: j }; }); })
      .then(function (r) {
        if (r.http === 200) { location.replace(DESTINO); return; }
        er.textContent = r.j.erro || 'Não foi possível entrar agora.'; er.hidden = false; $('senha').value = ''; $('senha').focus();
      })
      .catch(function () { er.textContent = 'Sem conexão. Tente de novo.'; er.hidden = false; })
      .then(function () { bt.disabled = false; bt.textContent = 'Entrar'; });
  });
})();
</script>
